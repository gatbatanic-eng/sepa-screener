<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>여섯 관점으로 보는 종목</title><link rel="stylesheet" href="review.css"></head>
<body><main>
<nav><a href="../">← 복구 모드</a><a href="../../">전체 스크리너</a></nav>
<header><span class="eyebrow">투자 판단 노트</span><h1>한 종목, 여섯 가지 관점</h1>
<p>근거와 우려를 함께 읽고, 판단이 바뀔 조건을 확인하세요.</p><p id="dates" class="muted"></p></header>
<section class="panel" aria-label="분석 대상 선택">
<h2>오늘 살펴볼 종목 <small id="count"></small></h2>
<p class="muted">자동 5개 · 보유 점검 3개 · 직접 선택 2개. 중복은 한 번만 표시합니다.</p>
<div id="automatic" class="chips" aria-label="자동 선정"></div>
<form id="add-form"><label for="stock">종목 이름 또는 코드</label><input id="stock" list="stock-list" placeholder="예: KR:005930 또는 US:AAPL" required autocomplete="off"><datalist id="stock-list"></datalist>
<label for="group">추가할 목록</label><select id="group"><option value="holdings">보유 점검 (최대 3)</option><option value="manual">직접 선택 (최대 2)</option></select><button type="submit">추가</button></form>
<p class="muted">현재 스크리너에 정상 데이터가 있는 종목을 선택할 수 있습니다. 보유 표시는 수량·비중 연동이 아니며 이 브라우저에만 저장됩니다.</p>
<div id="personal" class="chips" aria-label="내 선택"></div><button id="clear" class="quiet" type="button">내 선택 지우기</button>
<p id="status" role="status" aria-live="polite"></p></section>
<section id="detail" aria-live="polite"><p class="panel">종목을 선택하면 분석을 보여드립니다.</p></section>
<footer>규칙 기반 참고 의견 · 다수결 매수 판정 없음 · 가격·재무 기준일 확인 · 기존 진입·손절 규칙 유지</footer>
</main><script src="review.js" defer></script></body></html>
