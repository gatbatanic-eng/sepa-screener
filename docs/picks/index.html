<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 추천</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --border:#e3e5e9; --text:#1b1e24; --dim:#6b7280; --accent:#2563eb;
          --g-bg:#e6f7ec; --g-text:#157347; --y-bg:#fff2e0; --y-text:#b45309; --r-bg:#fdf2f2; --r-text:#b42318;
          --shadow:0 1px 3px rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --panel:#171a21; --border:#2a2e37; --text:#e7e9ee; --dim:#9aa2b1; --accent:#5b8def;
          --g-bg:#113322; --g-text:#6bd08a; --y-bg:#3a2712; --y-text:#f6b96a; --r-bg:#3a1717; --r-text:#f2a4a0; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .subtitle { color:var(--dim); font-size:13px; max-width:72ch; }
  .nav { display:flex; gap:10px; margin:10px 0 14px; flex-wrap:wrap; }
  .nav a { font-size:12px; color:var(--dim); text-decoration:none; border:1px solid var(--border); border-radius:999px; padding:4px 12px; background:var(--panel); }
  .nav a:hover { color:var(--accent); border-color:var(--accent); }
  .nav a.here { color:#fff; background:var(--accent); border-color:var(--accent); }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:16px; margin-bottom:18px; }
  .panel h2 { font-size:15px; margin:0 0 4px; }
  .meta { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .pill { display:inline-block; font-size:11px; font-weight:700; border-radius:999px; padding:1px 8px; margin-left:6px; }
  .GREEN,.ok { background:var(--g-bg); color:var(--g-text); } .YELLOW,.warn { background:var(--y-bg); color:var(--y-text); }
  .RED,.bad { background:var(--r-bg); color:var(--r-text); }
  .pick { border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; }
  .pick .top { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; }
  .pick .nm { font-weight:700; font-size:15px; } .pick .code { color:var(--dim); font-size:12px; }
  .pick .score { margin-left:auto; font-weight:700; font-variant-numeric:tabular-nums; }
  .why { margin:8px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:12px; border:1px solid var(--border); border-radius:6px; padding:1px 8px; }
  .tag.core { border-color:var(--accent); color:var(--accent); }
  .reasons { margin:8px 0 0; padding-left:0; list-style:none; font-size:13px; }
  .reasons li { padding:2px 0; } .reasons .k { display:inline-block; min-width:46px; color:var(--dim); font-size:11px; margin-right:6px; }
  .kv { margin-top:8px; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px 14px; font-size:12px; color:var(--dim); }
  .kv b { color:var(--text); font-variant-numeric:tabular-nums; }
  .note { background:var(--y-bg); color:var(--y-text); border-radius:8px; padding:8px 12px; font-size:13px; margin:8px 0; }
  details.v3 { margin:8px 0; font-size:13px; } details.v3 summary { cursor:pointer; color:var(--accent); }
  .empty { color:var(--dim); padding:10px 0; }
  table { width:100%; border-collapse:collapse; font-size:12px; } th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); }
  .scroll { overflow-x:auto; }
  .foot { color:var(--dim); font-size:12px; max-width:80ch; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>오늘의 추천</h1>
    <div class="subtitle">핵심 전략(SEPA·실적 턴어라운드)이 고른 종목을 매일 다시 심사해 시장별 최대 3개를 냅니다. 전략 선정 건수에 업종 강도·시장 환경을 더해 점수를 매기고, 손절폭·추격·유동성 조건을 통과한 종목만 올립니다. 매크로·이슈는 근거로만 보여주고 점수에는 넣지 않습니다. 매수 권유가 아니며, 하루 한 번 기록해 나중에 성과를 검증합니다.</div>
    <div class="nav">
      <a href="../">SEPA 추세템플릿</a>
      <a href="../funnel/">실적 턴어라운드</a>
      <a class="here" href="./">오늘의 추천</a>
      <a href="../performance/">전략 현황</a>
      <a href="../agents/">에이전트 리그</a>
      <a href="../advisory/">투자 자문 위원회</a>
    </div>
  </header>
  <div id="app"><div class="empty">불러오는 중…</div></div>
  <div class="panel"><h2>기록</h2><div class="meta">하루 한 번 기록한 추천입니다. 수정하지 않습니다.</div><div class="scroll" id="hist"></div></div>
  <p class="foot" id="rules"></p>
</div>
<script>
const MK = {kr:"한국", us:"미국"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KIND = {strategy:"전략", entry:"진입", sector:"업종", market:"시장", macro:"매크로", issue:"이슈"};
function pick(p, names, core) {
  const e = p.entry, v = p.v2 || {};
  const tags = Object.keys(p.strategies).map(k => `<span class="tag ${core.includes(k)?"core":""}">${esc(names[k]||k)}</span>`).join("");
  const adj = [v.sectorAdj ? `업종 ${v.sectorAdj>0?"+":""}${v.sectorAdj}` : "", v.marketAdj ? `시장 ${v.marketAdj}` : ""].filter(Boolean).join(" · ");
  const why = (p.why||[]).map(w => `<li><span class="k">${esc(KIND[w.kind]||w.kind)}</span>${esc(w.text)}</li>`).join("");
  return `<div class="pick"><div class="top"><span class="nm">${esc(p.name)}</span><span class="code">${esc(p.code)} · ${esc(p.market||"")}</span><span class="score">종합 ${v.score ?? p.score}점 <span class="code">(v1 ${p.score}${adj ? " · "+adj : ""})</span></span></div>
    <div class="why">${tags}</div>
    <ul class="reasons">${why}</ul>
    <div class="kv"><span>손절폭 <b>${e.riskPct}%</b> (${esc(e.riskSource)})</span><span>종가 <b>${p.price!=null?Number(p.price).toLocaleString():"-"}</b></span></div></div>`;
}
function market(m, r, names, core) {
  const rej = Object.entries(r.rejectSummary||{}).map(([k,v]) => `${esc(k)} ${v}`).join(" · ");
  const picks = r.picksV2 || r.picks;
  const v1 = r.picksV2 && r.picks.map(p=>p.code).join() !== r.picksV2.map(p=>p.code).join()
    ? `<div class="meta">참고 · v1(섹터 미반영) 추천: ${r.picks.map(p=>esc(p.name)).join(", ") || "없음"}</div>` : "";
  const v3 = (r.picksV3 || []).length ? `<details class="v3"><summary>실험 v3 · 손절폭 필터 없이 비중 조절 (${r.picksV3.length}종목)</summary>
    ${r.picksV3.map(p => `<div class="meta"><b>${esc(p.name)}</b> ${esc(p.code)} · 종합 ${p.v2.score}점 · 손절폭 ${p.entry.riskPct}% · 권고 비중 <b>${Math.round(p.weight*100)}%</b>${(p.why||[]).filter(w=>w.text.startsWith("참고")).map(w=>`<br>${esc(w.text)}`).join("")}</div>`).join("")}
    <div class="meta">백테스트에서 손절폭 8% 이하 필터가 추세 통과의 초과수익을 없앴기 때문에 만든 실험 계열입니다. 앞으로의 기록으로 검증하며 아직 근거로 쓰지 않습니다.</div></details>` : "";
  const v4 = (r.picksV4 || []).length ? `<details class="v3"><summary>실험 v4 · 추세 통과 + 변동성 3% 이상, 미국 전용 (${r.picksV4.length}종목)</summary>
    ${r.picksV4.map(p => `<div class="meta"><b>${esc(p.name)}</b> ${esc(p.code)} · 종합 ${p.v2.score}점 · RS ${p.rs} · ATR ${p.atrPct}% · 손절폭 ${p.entry.riskPct}% · 권고 비중 <b>${Math.round(p.weight*100)}%</b></div>`).join("")}
    <div class="meta">견고성 확인에서 미국만 통과한 조건입니다(한국은 실패). 평균보다 중앙값이 훨씬 낮은 변동 큰 전략이며 앞으로의 기록으로 검증합니다.</div></details>` : "";
  const cmpRows = (() => {
    const by = {};
    [["v1", r.picks], ["v2", r.picksV2], ["v3", r.picksV3], ["v4", r.picksV4]].forEach(([k, list]) => (list || []).forEach(p => {
      const e = by[p.code] = by[p.code] || {code: p.code, name: p.name, risk: p.entry && p.entry.riskPct};
      e[k] = (k === "v3" || k === "v4") && p.weight != null ? `${Math.round(p.weight*100)}%` : "●";
    }));
    return Object.values(by).sort((a, b) => ["v2","v1","v3","v4"].findIndex(k => a[k]) - ["v2","v1","v3","v4"].findIndex(k => b[k]) || a.name.localeCompare(b.name));
  })();
  const cmp = cmpRows.length ? `<details class="v3" open><summary>버전별 추천 비교 (●=추천, v3·v4는 권고 비중)</summary>
    <div class="scroll"><table><thead><tr><th>종목</th><th>손절폭</th><th>v1<br><span class="code">섹터 미반영</span></th><th>v2<br><span class="code">주 추천</span></th><th>v3<br><span class="code">필터 없이 비중</span></th><th>v4<br><span class="code">${m === "us" ? "추세+변동성" : "미국 전용"}</span></th></tr></thead><tbody>
    ${cmpRows.map(x => `<tr><td><b>${esc(x.name)}</b> <span class="code">${esc(x.code)}</span></td><td>${x.risk != null ? x.risk + "%" : "-"}</td>${["v1","v2","v3","v4"].map(k => `<td style="text-align:center">${x[k] || ""}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div></details>` : "";
  const regs = Object.entries((r.context||{}).regimes||{}).map(([k,v]) => `<span class="pill ${esc(v)}">${esc(k)} ${esc(v)}</span>`).join("");
  const cov = (r.context||{}).sectorCoverage;
  const sec = ((r.context||{}).sectors||[]);
  const secLine = sec.length ? `<div class="meta">업종 강도 상위: ${sec.slice(0,3).map(s=>esc(s.sector)+" "+s.strength).join(", ")} · 하위: ${sec.slice(-3).map(s=>esc(s.sector)+" "+s.strength).join(", ")}${cov ? ` · 후보 ${cov.candidates}개 중 업종 확인 ${cov.known}개` : ""}</div>` : "";
  return `<div class="panel"><h2>${MK[m]} ${regs}</h2>
    <div class="meta">기준 ${esc(r.session)} · 후보 ${r.candidates}개 중 진입 적합 ${r.suitable}개</div>
    ${picks.length ? picks.map(p => pick(p, names, core)).join("") : `<div class="empty">오늘은 진입 적합 종목이 없습니다.</div>`}
    ${r.shortfall && picks.length < 3 ? `<div class="note">${esc(r.shortfall)}</div>` : ""}
    ${cmp}${v1}${v3}${v4}${secLine}
    ${rej ? `<div class="meta">탈락 사유: ${rej}</div>` : ""}
    ${r.entryUnknown ? `<div class="meta">손절폭을 계산하지 못한 종목 ${r.entryUnknown}개는 제외했습니다.</div>` : ""}</div>`;
}
fetch("../research/daily_picks.json", {cache:"no-store"}).then(r => r.json()).then(d => {
  document.getElementById("app").innerHTML = ["kr","us"].filter(m => d.latest[m]).map(m => market(m, d.latest[m], d.strategyNames, d.coreStrategies)).join("") || '<div class="empty">아직 기록이 없습니다.</div>';
  const rows = d.history.map(h => `<tr><td>${esc(h.session)}</td><td>${MK[h.market]}</td><td>${h.picks.map(p=>esc(p.name)+" "+p.riskPct+"%").join(", ")||"-"}</td><td>${h.suitable}/${h.candidates}</td></tr>`).join("");
  document.getElementById("hist").innerHTML = rows ? `<table><thead><tr><th>기준일</th><th>시장</th><th>추천(손절폭)</th><th>적합/후보</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">기록 없음</div>';
  const r = d.rules;
  document.getElementById("rules").textContent = `규칙(v2): 점수 = 전략 선정(핵심 2·연구 1) + 업종 강도 상위 1/3 +1·하위 1/3 -1 + 시장 RED -1. 손절폭 0 초과 ${r.maxRiskPct}% 이하, 추격·SEPA NO-GO·유동성 부족 제외. 보유 가정은 종가 -${r.stopLossPct}% 이하 청산, ${r.holdDays}거래일. 장중 손절은 가정하지 않으며 주문은 하지 않습니다. 이 규칙은 결과를 본 뒤 바꾸지 않고, 바꿀 때는 새 계열로 병행합니다.`;
}).catch(() => { document.getElementById("app").innerHTML = '<div class="empty">추천 파일을 읽지 못했습니다.</div>'; });
</script>
</body>
</html>
