<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>골든코드 조기 진입 연구 v3</title>
<style>body{margin:0;background:#10171d;color:#edf1f3;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:30px}h2{font-size:22px}small{color:#bcc6cc}section,.notice{border:1px solid #415058;border-radius:12px;padding:20px;margin:20px 0;background:#18242c}.notice{border-color:#d0ac56}select{font:inherit;padding:8px;color:inherit;background:#18242c}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:10px;border-bottom:1px solid #415058}.scroll{overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:16px;background:#10171d;border-radius:8px}dt{color:#bcc6cc}dd{margin:0 0 8px;overflow-wrap:anywhere}a{color:#e7c776}@media(max-width:700px){.grid{grid-template-columns:1fr}}details{margin:12px 0}summary{cursor:pointer}</style>
<main><small>GOLDEN CODE / ENTRY RESEARCH V3</small><h1>진입 기회와 위험을 전략별로 비교합니다</h1><div class="notice">사후 연구 결과입니다. 운영 추천·매수 승인으로 사용하지 않습니다. 정석 SEPA, 공격형, 선행 진입, 촉매 재돌파는 독립적으로 표시합니다.</div><p id="status">연구 자료를 불러오는 중입니다.</p><section><h2>동일 체결 조건의 비교</h2><div id="comparison"></div></section><section><h2>종목 사례</h2><label>분석 종목 <select id="symbol"></select></label><div id="case"></div></section><section><h2>검증 범위와 한계</h2><ul id="limits"></ul></section><small>기존 추천 화면과 별도 연구 페이지입니다. 이 페이지를 여는 동작은 데이터 갱신·유료 조사·주문을 실행하지 않습니다.</small></main>
<script type="module">
const names={sepa:'정석 SEPA 엔진',aggressive:'기존 공격형',early:'선행 진입 v3',catalyst:'촉매 후 재돌파 v3'};
const e=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>typeof v==='number'&&Number.isFinite(v)?v.toFixed(2):'—';
try{const response=await fetch('./report.json');if(!response.ok)throw Error('자료 없음');const r=await response.json();
document.querySelector('#status').textContent=`가격 기준일 ${r.priceAsOf} · ${r.sample.n}종목 · 자료 생성 ${r.generatedAt} · 과거 저장 신호와 재계산 결과는 서로 다른 자료입니다.`;
document.querySelector('#comparison').innerHTML=`<div class="scroll"><table><thead><tr><th>전략</th><th>신호 / 청산</th><th>평균 손익 %</th><th>승률 %</th><th>손절률 %</th><th>평균 실현 R</th><th>계좌 MDD %</th></tr></thead><tbody>${Object.entries(r.strategies).map(([k,v])=>`<tr><td>${names[k]}</td><td>${v.all.signals} / ${v.all.closed}</td><td>${n(v.all.meanReturnPct)}</td><td>${n(v.all.winRate===null?null:v.all.winRate*100)}</td><td>${n(v.all.stopRate===null?null:v.all.stopRate*100)}</td><td>${n(v.all.meanRealizedR)}</td><td>${n(v.portfolio.mddPct)}</td></tr>`).join('')}</tbody></table></div><small>익일 시가 · 편도 10bp · 당일 손절 우선 · 목표/40일 청산. 계좌는 직전 평가액 5%씩 최대20종목. 미체결·미성숙은 청산 평균에서 제외합니다.</small>`;
const sel=document.querySelector('#symbol');sel.innerHTML=Object.keys(r.cases).map(s=>`<option>${e(s)}</option>`).join('');
function render(){const c=r.cases[sel.value];document.querySelector('#case').innerHTML=`<p>기술적 상승의 서술 기준: 8월 이후 최초 하루 +5% 이상 ${e(c.firstDescriptiveUp5PctDate)}. 매수 신호 정의와 별개입니다.</p><div class="grid">${Object.entries(names).map(([k,label])=>{const t=c.earliestResearchSignals[k],latest=c.latestResearch.find(x=>x.strategy===k);return `<div class="card"><h3>${label}</h3>${t?`<dl><dt>재계산 최초 신호일 / 가격 기준일</dt><dd>${e(t.signalDate)}</dd><dt>후보 / 손절 / 피벗</dt><dd>${n(t.entry)} / ${n(t.stop)} / ${n(t.pivot)}</dd><dt>1차 / 2차 목표 · 예상 R/R</dt><dd>${n(t.target1)} / ${n(t.target2)} · ${n(t.rr)}</dd><dt>실제 체결 모형 상태 / 결과</dt><dd>${e(t.execution.status)} · ${n(t.execution.returnPct)}%</dd><dt>최종 연구 등급 / 운영 추천 제외 사유</dt><dd>${e(t.grade||'별도 등급 없음')} · 사후 데이터·전략 기대값 미검증</dd></dl>`:`<p>이 기간에 신규 체결 후보가 없습니다.</p>`}${latest?`<p>최신 재계산 ${e(latest.date)} · ${e(latest.verdict)}</p><small>${latest.reasons.map(e).join(' · ')}</small>`:''}</div>`}).join('')}</div><details><summary>당시 저장된 실제 신호: 정석 ${c.storedHistorical.sepa.length}건 / 공격형 ${c.storedHistorical.aggressive.length}건</summary><p>기록 부재는 NO-GO로 해석하지 않습니다. 저장 신호는 종가 관찰 성과이며 위 체결 모형과 다릅니다.</p><div class="scroll"><table><tr><th>구분</th><th>저장일</th><th>단계</th><th>원본 종가</th></tr>${Object.entries(c.storedHistorical).flatMap(([k,xs])=>xs.map(x=>`<tr><td>${names[k]}</td><td>${e(x.date)}</td><td>${e(x.group)}</td><td>${n(x.originalClose)}</td></tr>`)).join('')}</table></div></details>`;}
sel.addEventListener('change',render);render();document.querySelector('#limits').innerHTML=r.limitations.map(x=>`<li>${e(x)}</li>`).join('');
}catch(error){document.querySelector('#status').textContent='검증된 연구 결과 파일이 없습니다. 진입 판정은 보류합니다.';}
</script></html>
