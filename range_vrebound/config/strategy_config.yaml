# RANGE-MR & V-REBOUND 전략 파라미터
#
# 여기 있는 모든 값이 CONFIG의 전체 범위다. 코드에 파라미터를 하드코딩하지
# 않는다 (개발 원칙 2.2). 각 값의 근거/제안 배경은
# C:\Users\gatba\.claude\plans\lively-herding-eclipse.md 1절을 참고할 것.

market_regime:
  crash:
    return_lookback_days: 20
    return_20d_max: -0.10          # 시장 20일 수익률 <= -10%
    drawdown_lookback_days: 60
    drawdown_60d_max: -0.15        # 60일 고점 대비 하락률 <= -15%
  range:                           # 추세 부재 + 좁은 밴드 (Phase 0 제안 1.3, 사용자 확정)
    lookback_days: 60
    abs_return_max: 0.07           # |60일 수익률| <= 7%
    band_width_max: 0.12           # (60일 고가-저가)/저가 <= 12%
  recovery:
    lookback_days: 20              # CRASH 저점 이후 관찰 기간

range_mr:
  box:
    period_days: 60
    width_min: 0.15
    width_max: 0.40
    position_max: 0.25
  support:
    tolerance_pct: 0.03
    confirmation_window_days: 3
    rebound_threshold_pct: 0.03
    min_touches_high_quality: 2
  trigger:
    breakout_lookback_days: 3
    volume_ratio_min: 1.2
    volume_avg_days: 20
    rs_days: 5
    ma_recovery_lookback_days: 3   # "20DMA 회복"(상승 반전) 판정에 쓰는 lookback
  mean_reversion:
    ma_period: 20               # "20DMA" — 스펙 9/10조가 명시하는 고정 지표
    rsi_period: 14              # 스펙 9조: RSI는 보조지표로만 사용 (표준 기간)
  liquidity:
    min_avg_trading_value_krw: 1000000000   # 일평균거래대금 10억원 (Phase 4 제안, 신설)
  score_weights:                   # 총합 100 (Setup Score, 스펙 11조)
    box_stability: 15
    box_position: 20
    support_strength: 15
    mean_reversion: 15
    rsi: 5
    quality: 10
    liquidity: 10
    rr: 10
  trigger_score_weights:           # 총합 100 (Trigger Score — 스펙에 배점표 없어 균등 배점으로 신설, Phase 4 제안)
    breakout: 20
    volume: 20
    bullish_candle: 20
    ma_recovery: 20
    rs: 20
  thresholds:
    setup_score_min: 70
    trigger_score_min: 60
    buy_trigger_score_min: 75
    buy_rr_min: 2.0
  stop:
    atr_period: 14
    atr_multiplier: 0.5

v_rebound:
  filter:
    high_lookback_days: 60
    drawdown_max: -0.25
    excess_return_60d_max_pp: -0.10
  stabilization:
    confirm_window_days: 3
    rebound_from_low_pct: 0.03
  volume:
    avg_days: 20
    rebound_ratio_min: 1.3
    rebound_ratio_strong: 1.5
    rebound_ratio_very_strong: 2.0
  first_rebound_high:
    min_days_after_low: 3
    max_days_after_low: 10
  rs:
    days: 5
  breakout:
    volume_ratio_min: 1.3
  score_weights:                   # 총합 100
    abs_drawdown: 15
    market_excess_drawdown: 15
    sector_excess_drawdown: 10
    quality: 15
    stabilization: 15
    volume_recovery: 10
    relative_strength: 10
    breakout: 10
  thresholds:
    setup_score_min: 70
    buy_score_min: 75
    buy_rebound_volume_min: 1.3
    buy_rr_min: 2.0
  stop:
    atr_period: 14
    atr_multiplier: 0.5

risk:
  rr_min_for_buy_candidate: 2.0
  rr_gate_uses: "rr_1"              # TP1 기준 (Phase 0 제안 6)

regime_gates:                       # Phase 0 제안 1
  enabled: true
  range_mr_regimes: ["RANGE", "NORMAL"]
  v_rebound_regimes: ["CRASH", "RECOVERY"]

backtest:
  holding_periods_days: [5, 10, 20, 40]
  entry_price: "next_open"          # 신호는 T일 종가 기준, 체결은 T+1일 시가 (Phase 0 제안 3)
  walk_forward:
    box_period_grid: [40, 60, 80, 120]
    drawdown_grid: [-0.20, -0.25, -0.30, -0.35, -0.40]
    volume_ratio_grid: [1.2, 1.3, 1.5, 2.0]
    rr_grid: [1.5, 2.0, 2.5, 3.0]

universe:
  market: "KR"
  top_n_by_market_cap: 200

data:
  history_calendar_days: 900
  min_trading_days: 260
