# TQQQ 변동성조절 일일 신호용 현재 계좌 상태. 매매 후 shares 와 cash_usd 를 실제 값으로 고쳐 주세요.
# (GitHub 앱/웹에서 이 파일 연필 아이콘 → 수정 → Commit)
shares: 55          # 보유 TQQQ 주식 수 (평단 $69.16, 2026-10-28 12주 추가 매수)
cash_usd: 7526      # 이 전략에 쓸 남은 달러 현금 (1,500만원 / 1,324 − 55주 x 69.16 ≈ 7,526)

# 분할 진입: 지금 비중(약 27%)에서 목표 비중까지 ramp_weeks 주에 걸쳐 매주 1/ramp_weeks 씩 맞춘다.
# 이 기간에는 밴드 대신 ramp_min_gap(2%p) 이상 모자랄 때 매수. 위험 축소(매도)는 평소 규칙대로.
ramp_start: 2026-10-27
ramp_weeks: 5
ramp_start_weight: 0.267
ramp_min_gap: 0.02

# 전략 설정 (백테스트 추천값)
target_vol: 0.35    # 목표 변동성
lookback: 20        # 실현변동성 계산 기간(거래일)
band: 0.10          # 목표 비중과 이만큼(%p) 넘게 차이 날 때만 매매
