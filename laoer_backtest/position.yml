# TQQQ 변동성조절 일일 신호용 현재 계좌 상태. 매매 후 shares 와 cash_usd 를 실제 값으로 고쳐 주세요.
# (GitHub 앱/웹에서 이 파일 연필 아이콘 → 수정 → Commit)
shares: 72          # 보유 TQQQ 주식 수 (평단 $68.70, 2026-10-30 17주 추가 매수 · 매수단가 약 $67.21)
