name: Leader Entry Backtest

# 주도주 진입 규칙(손절폭 8% 이하 필터 vs 추격 허용·눌림목·돌파) 백테스트. 수동 실행 전용, 기존 파이프라인과 연결하지 않는다. 결과는 research/leader_backtest.
on:
  workflow_dispatch:
    inputs:
      fetch_start:
        description: "가격 수집 시작일(평가 시작 15개월 전)"
        default: "2023-06-01"
      eval_start:
        description: "평가 시작일"
        default: "2024-09-02"
      only:
        description: "all=기존 백테스트+robust+운용형, ops=운용형만, index=지수 필터만, search=대규모 규칙 탐색"
        default: "all"
      search_n:
        description: "search: 탐색 조합 수"
        default: "100000"
      null_reps:
        description: "search: 귀무(섞은 데이터) 복제 횟수"
        default: "8"
      out_name:
        description: "결과 하위 폴더(비우면 기존 파일 덮어씀)"
        default: ""

permissions:
  contents: write

concurrency:
  group: leader-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest tests.test_leader_backtest tests.test_leader_ops tests.test_leader_index_filter tests.test_leader_search -v
      - name: Run backtest
        if: inputs.only == 'all'
        env:
          LB_FETCH_START: ${{ inputs.fetch_start }}
          LB_EVAL_START: ${{ inputs.eval_start }}
          LB_OUT: ${{ inputs.out_name }}
        run: python -m leader_backtest.main
      - name: Run robustness (sepa universe, PRE/OOS split at rule freeze date)
        if: inputs.only == 'all'
        env:
          LB_FETCH_START: ${{ inputs.fetch_start }}
          LB_EVAL_START: ${{ inputs.eval_start }}
          LB_OUT: ${{ inputs.out_name }}
        run: python -m leader_backtest.robust
      - name: Run operating (portfolio) simulation
        if: inputs.only == 'all' || inputs.only == 'ops'
        env:
          LB_FETCH_START: ${{ inputs.fetch_start }}
          LB_EVAL_START: ${{ inputs.eval_start }}
          LB_OUT: ${{ inputs.out_name }}
        run: python -m leader_backtest.ops
      - name: Run index filter comparison
        if: inputs.only == 'index'
        env:
          LB_OUT: ${{ inputs.out_name }}
        run: python -m leader_backtest.index_filter
      - name: Run large-scale rule search (train/val/test + null)
        if: inputs.only == 'search'
        env:
          LB_OUT: ${{ inputs.out_name }}
          LB_FETCH_START: "2015-06-01"
          SEARCH_N: ${{ inputs.search_n }}
          SEARCH_NULL_REPS: ${{ inputs.null_reps }}
        run: python -m leader_backtest.search
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f research/leader_backtest
          git add -f research/leader_backtest/archive_2026-10-10
          git diff --cached --quiet && exit 0
          git commit -m "주도주 진입 규칙 백테스트 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
