name: Multi-Factor Screener Daily

on:
  schedule:
    # 한국장 마감 후: 평일 21:00 KST = UTC 12:00 (SEPA 20:00 / range_vrebound 20:30 과 겹치지 않게)
    - cron: "0 12 * * 1-5"
    # 미국장 마감 후: 평일 UTC 22:30 (= KST 07:30 익일)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "실행할 시장"
        required: false
        default: "all"
        type: choice
        options: [kr, us, all]
      kr_max_tickers:
        description: "한국 시총 상위 N종목"
        required: false
        default: "300"
      us_max_tickers:
        description: "미국 S&P500 상위 N종목"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: multifactor-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 스케줄 실행은 시장을 나눠도 대시보드가 한 시장만 담게 되므로 항상 all 로 돌린다.
      # (수동 실행 시에만 market 입력으로 좁힐 수 있다.)
      - name: 스크리닝 실행
        run: >
          python -m screener.main
          --market ${{ github.event.inputs.market || 'all' }}
          --kr-max-tickers ${{ github.event.inputs.kr_max_tickers || 300 }}
          --us-max-tickers ${{ github.event.inputs.us_max_tickers || 120 }}
          --output output/screening_result.csv

      - name: 랭킹 리포트 생성
        run: python -m screener.report

      - name: 추적 지수 갱신
        run: python -m screener.index_builder --top-n 20 --rebalance monthly

      - name: 대시보드(docs/screener/) 생성
        run: python -m screener.generate_dashboard

      - name: 결과 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multifactor-result-${{ github.run_id }}
          path: |
            output/screening_result.csv
            output/report_*.md
          retention-days: 90

      - name: 지수 상태 + 대시보드 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/index_state.json output/index_history.csv docs/screener/
          git diff --cached --quiet || git commit -m "멀티팩터 스크리너 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin master
          git push
