name: Tenbagger Funnel Screen (KR+US)

on:
  workflow_dispatch:
    inputs:
      market:
        description: "kr | us | all"
        default: "all"
  schedule:
    # 평일 매일 한 번씩 그 시장의 마감 확정 뒤에 기록한다. 같은 거래일은 한 번만 기록되므로(이미 있으면 건너뜀) 뒤의 예비 실행은 지연·실패 대비다.
    # 한국: 평일 18:23 KST(장 마감 06:30 UTC 뒤), 예비 20:47 KST
    - cron: "23 9 * * 1-5"
    - cron: "47 11 * * 1-5"
    # 미국: 화~토 14:47 KST(전날 미국 장 마감 뒤, Yahoo 일봉 확정 05시 UTC 무렵), 예비 17:17 KST
    - cron: "47 5 * * 2-6"
    - cron: "17 8 * * 2-6"
  push:
    branches: [master]
    paths:
      - funnel/**
      - tests/test_funnel.py
      - data/funnel_manual.csv
      - data/ai_infra_basket.csv
      - .github/workflows/funnel.yml

permissions:
  contents: write

jobs:
  funnel:
    strategy:
      fail-fast: false
      matrix:
        market: [kr, us]
    concurrency:
      group: funnel-${{ github.ref }}-${{ matrix.market }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: 이 시장을 실행할지 결정
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_MARKET: ${{ github.event.inputs.market }}
          MARKET: ${{ matrix.market }}
        run: |
          run=false; flag=""
          if [ "$EVENT" = "schedule" ]; then
            case "$CRON" in
              "23 9 * * 1-5"|"47 11 * * 1-5") [ "$MARKET" = "kr" ] && run=true ;;
              "47 5 * * 2-6"|"17 8 * * 2-6") [ "$MARKET" = "us" ] && run=true ;;
            esac
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_MARKET" ] || [ "$INPUT_MARKET" = "all" ] || [ "$INPUT_MARKET" = "$MARKET" ]; then run=true; fi
            flag="--refresh-view"
          else
            run=true; flag="--refresh-view"   # 코드 변경 push: 화면 파일을 다시 만들되 스냅샷은 덮어쓰지 않는다
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.plan.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.plan.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Verify funnel rules
        if: steps.plan.outputs.run == 'true'
        run: python -m unittest tests.test_funnel -v
      - name: Screen full universe (${{ matrix.market }})
        if: steps.plan.outputs.run == 'true'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: 'GoldenCodeResearch gatbatanic@gmail.com'
        run: python -m funnel.main --market "${{ matrix.market }}" ${{ steps.plan.outputs.flag }}
      - name: Save funnel results
        if: always() && steps.plan.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in "docs/research/funnel_${{ matrix.market }}.json" "research/funnel/${{ matrix.market }}" "research/funnel/cache/${{ matrix.market }}"; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "깔때기 스크리너 갱신 ${{ matrix.market }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
