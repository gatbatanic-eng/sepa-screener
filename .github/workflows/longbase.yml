name: Longbase Breakout Screening

on:
  schedule:
    # 한국: 평일 20:41 KST = UTC 11:41 / 미국: 평일 08:41 KST(전날 장마감 후) = UTC 23:41
    - cron: "41 11 * * 1-5"
    - cron: "41 23 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "실행할 시장"
        required: false
        default: "ALL"
        type: choice
        options: [KR, US, ALL]
      limit:
        description: "개발/테스트용: 유니버스 앞에서 N종목만 (비우면 전체)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: longbase
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install finance-datareader pandas numpy requests
      - name: 단위 테스트
        run: python tests/test_longbase.py
      - name: 실행 시장 결정
        id: market
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "41 11 * * 1-5" ]; then echo "market=KR" >> "$GITHUB_OUTPUT"; else echo "market=US" >> "$GITHUB_OUTPUT"; fi
          else
            echo "market=${{ github.event.inputs.market || 'ALL' }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 스크리닝 실행
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python -m longbase.run --market ${{ steps.market.outputs.market }} --limit "${{ github.event.inputs.limit }}"
          else
            python -m longbase.run --market ${{ steps.market.outputs.market }}
          fi
      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/longbase docs/data/longbase_*.json
          git diff --cached --quiet || git commit -m "롱베이스 돌파 스크리너 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin master
          git push
