name: Momentum Strategy Daily Screening

on:
  schedule:
    # 미국장 마감 이후 1회(스펙 1번): 국내 전일 종가 + 미국 당일 종가를 한 번에 처리.
    # 다른 서브시스템들의 미국 트리거(22:45 UTC)와 겹치지 않게 뒤로 살짝 뺐다.
    - cron: "20 23 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "개발/테스트용: 유니버스 앞에서 N종목만 (비우면 전체)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: momentum-signals-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: momentum_signals
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 단위 테스트(포지션 관리 상태머신·look-ahead 회귀 포함)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 스크리닝 + 포지션 관리 실행
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python run_daily_screen.py --limit "${{ github.event.inputs.limit }}"
          else
            python run_daily_screen.py
          fi

      - name: 대시보드(../docs/momentum/index.html) 생성
        run: python generate_dashboard.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../docs/momentum/
          git diff --cached --quiet || git commit -m "모멘텀 전략 스크리너 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin master
          git push
