name: Opportunity Layer V1 Research

on:
  workflow_dispatch:
  push:
    branches:
      - 'research/opportunity-layer-v1-20261108'
    paths:
      - '.github/workflows/opportunity-v1.yml'
  pull_request:
    paths:
      - 'leader_backtest/opportunity*.py'
      - 'tests/test_opportunity.py'
      - '.github/workflows/opportunity-v1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas yfinance
      - run: python -m unittest discover -s tests -p 'test_opportunity.py'
  historical-research:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas yfinance
      - run: python -m leader_backtest.opportunity_run > opportunity_v1_run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opportunity-v1-report
          path: |
            research/leader_backtest/opportunity_v1_results.json
            opportunity_v1_run.log
