name: Strategy Performance Ledger

on:
  workflow_dispatch:
  schedule:
    # 평일 22:40 UTC (미국 장 마감 뒤). 신호 파일은 하루가 끝난 스냅샷만 고정한다.
    - cron: "40 22 * * 1-5"
  push:
    branches: [master, "claude/**"]
    paths:
      - ledger/**
      - agents/**
      - tests/test_ledger.py
      - tests/test_agents.py
      - .github/workflows/ledger.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: sepa-screening
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify ledger rules
        run: python -m unittest tests.test_ledger tests.test_agents -v
      - name: Update ledger, outcomes and statistics
        run: python -m ledger.main
      - name: Update agent league (virtual accounts)
        # 코드 변경(push)으로 시작된 실행은 '하루 한 번' 기록(권고안 스냅샷·보고서·알림)을 남기지 않는다. 예약·수동 실행만 기록한다.
        run: python -m agents.main ${{ github.event_name == 'push' && '--no-freeze' || '' }}
      - name: Daily / weekly / monthly reports
        if: github.event_name != 'push'
        run: python -m agents.report --new-list "$RUNNER_TEMP/new_reports.txt"
      - name: Post new reports to the report issue (push notification)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/new_reports.txt" ] || exit 0
          n=$(gh issue list --state open --search '"에이전트 리그 보고" in:title' --json number,title --jq '[.[] | select(.title | startswith("에이전트 리그 보고"))][0].number')
          [ -n "$n" ] || { echo "보고 이슈를 찾지 못했습니다"; exit 1; }
          while read -r f; do
            { cat "$f"; echo; echo "[전체 보기](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${f#"$PWD"/})"; } > "$RUNNER_TEMP/body.md"
            gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
          done < "$RUNNER_TEMP/new_reports.txt"
      - name: Save ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in research/ledger research/agents docs/research/ledger.json docs/research/agents.json docs/agents/reports; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "전략 성과 원장 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
