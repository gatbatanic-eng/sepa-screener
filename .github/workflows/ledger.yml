name: Strategy Performance Ledger

on:
  workflow_dispatch:
  schedule:
    # 아침 보고(2026-10-08 운영 변경): 평일 기준일 D의 기록(보고서·메모·추천·스냅샷)을 D 다음 날 아침 KST에 쓴다.
    # 23:17·23:47 UTC = 08:17·08:47 KST. 한국은 D 장 마감, 미국은 D 직전 평일 장 마감 기준이다(agents/freshness.py basis).
    # 미국 D 장은 막 끝나 Yahoo 일봉이 미확정이라 쓰지 않는다(미국 스크리닝은 05:00 UTC, 다음 아침 보고에 반영).
    # 시세가 아직 최신이 아니면 기록을 미루고 뒤 실행이 쓴다: 01:13 UTC, 07:43 UTC(NHPLUG 수집 뒤라 한국 휴장일 판정 가능),
    # 19:13 UTC(기한 다음 날 18:00 UTC 뒤라 끝내 시세가 안 오면 낡은 시세 표시로 기록). 이미 기록한 날은 건너뛴다.
    # 기준일은 agents.config.session_date()(22:40 UTC 이후 = 그날)가 정하므로 위 시각 모두 같은 기준일 D로 센다.
    - cron: "17 23 * * 1-5"
    - cron: "47 23 * * 1-5"
    - cron: "13 1 * * 2-6"
    - cron: "43 7 * * 2-6"
    - cron: "13 19 * * 2-6"
  push:
    branches: [master, "claude/**"]
    paths:
      - ledger/**
      - agents/**
      - advisory/**
      - tests/test_ledger.py
      - tests/test_agents.py
      - tests/test_advisory.py
      - tests/test_picks.py
      - tests/test_freshness.py
      - tests/test_nhplug.py
      - tests/test_accumulation.py
      - tests/test_flowforward.py
      - tests/test_close_report.py
      - nhplug/**
      - .github/workflows/ledger.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: sepa-screening
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify ledger rules
        run: python -m unittest tests.test_ledger tests.test_agents tests.test_advisory tests.test_picks tests.test_freshness tests.test_nhplug tests.test_accumulation tests.test_flowforward tests.test_close_report -v
      - name: Update ledger, outcomes and statistics
        run: python -m ledger.main
      - name: Update agent league (virtual accounts)
        # 코드 변경(push)으로 시작된 실행은 '하루 한 번' 기록(권고안 스냅샷·보고서·알림)을 남기지 않는다. 예약·수동 실행만 기록한다.
        run: python -m agents.main ${{ github.event_name == 'push' && '--no-freeze' || '' }}
      - name: Daily / weekly / monthly reports
        if: github.event_name != 'push'
        run: python -m agents.report --new-list "$RUNNER_TEMP/new_reports.txt"
      - name: Investment advisory memo (daily / weekly / monthly)
        # push(코드 변경)는 latest.json만 갱신하고 보관·알림은 하지 않는다. 예약·수동 실행만 하루 한 번 기록한다.
        run: python -m advisory.main ${{ github.event_name == 'push' && '--preview' || format('--new-list {0}/new_memos.txt', runner.temp) }}
      - name: Pick outcomes (record + 5/20/40-session results vs index and control)
        continue-on-error: true
        run: python -m advisory.picks_track
      - name: Post new reports to the report issue (push notification)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          post() {  # $1=새 보고서 목록 파일, $2=이슈 제목 접두
            [ -s "$1" ] || return 0
            n=$(gh issue list --state open --search "\"$2\" in:title" --json number,title --jq "[.[] | select(.title | startswith(\"$2\"))][0].number")
            [ -n "$n" ] || { echo "이슈를 찾지 못했습니다: $2"; return 1; }
            while read -r f; do
              { cat "$f"; echo; echo "[전체 보기](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${f#"$PWD"/})"; } > "$RUNNER_TEMP/body.md"
              gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
            done < "$1"
          }
          rc=0
          post "$RUNNER_TEMP/new_reports.txt" "에이전트 리그 보고" || rc=1
          post "$RUNNER_TEMP/new_memos.txt" "투자 자문 메모" || rc=1
          exit $rc
      - name: Save ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in research/ledger research/agents research/advisory docs/research/ledger.json docs/research/agents.json docs/agents/reports docs/advisory; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "전략 성과 원장 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
