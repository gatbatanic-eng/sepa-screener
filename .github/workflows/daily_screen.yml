name: SEPA Trend Template Daily Screening

on:
  push:
    branches: [master]
    paths: ["screening.py", "ai_tracker.py", "tests/test_ai_tracker.py", "range_screen.py", "tests/test_range_screen.py", "research_tracker.py", "tests/test_research_tracker.py", "personas/**", "tests/test_personas.py", "tests/test_personas_data.py", ".github/workflows/daily_screen.yml"]
  schedule:
    # 한국: 평일(월~금) 20:00 KST = UTC 11:00
    - cron: "0 11 * * 1-5"
    # 미국: 평일 장마감(4:00pm ET) 후 약 1~2시간 뒤 = UTC 22:00 (=KST 07:00, 다음날)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "실행할 시장"
        required: false
        default: "ALL"
        type: choice
        options: [KR, US, ALL]

permissions:
  contents: write

concurrency:
  group: sepa-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # v2: KR 유니버스가 유동성 상위 ~700종목으로 늘고 SETUP/ENTRY/EXIT 계산이 추가돼 여유를 둔다.
    timeout-minutes: 60
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 연구 계산 검증
        run: |
          python -m unittest discover -s tests -p "test_*screen.py" -v
          python -m unittest discover -s tests -p test_research_tracker.py -v
          python tests/test_ai_tracker.py
          python -m unittest tests.test_personas tests.test_personas_data -v

      - name: 실행 시장 결정
        id: market
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 11 * * 1-5" ]; then
              echo "market=KR" >> "$GITHUB_OUTPUT"
            else
              echo "market=US" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            # 데이터 수집 수정 후 특정 시장을 즉시 재검증할 수 있게 커밋 태그를 지원한다.
            if [[ "${{ github.event.head_commit.message }}" == *"[run-kr]"* ]]; then
              echo "market=KR" >> "$GITHUB_OUTPUT"
            elif [[ "${{ github.event.head_commit.message }}" == *"[run-all]"* ]]; then
              echo "market=ALL" >> "$GITHUB_OUTPUT"
            else
              echo "market=US" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "market=${{ github.event.inputs.market || 'ALL' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 스크리닝 실행 (${{ steps.market.outputs.market }})
        env:
          SEPA_RESEARCH_EXPORT: "1"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python screening.py --market ${{ steps.market.outputs.market }}

      - name: 결과 CSV 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sepa-screening-result-${{ github.run_id }}
          path: output/*.csv
          retention-days: 90

      - name: 일별 기록과 5·20·60거래일 성과 갱신
        id: research
        continue-on-error: true
        run: python research_tracker.py --market ${{ steps.market.outputs.market }}

      - name: 페르소나 입력 수집(Yahoo 밸류에이션 + 성과 기록 점검)
        id: personas
        continue-on-error: true
        run: python -m personas.collect --market "$(echo "${{ steps.market.outputs.market }}" | tr 'A-Z' 'a-z')"

      - name: 대시보드(docs/index.html) 생성
        run: python generate_dashboard.py

      - name: 종목 상세 차트 갱신
        id: charts
        continue-on-error: true
        run: python publish_stock_charts.py --market ${{ steps.market.outputs.market }}

      - name: 대시보드 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p research
          git add docs/ research/
          git diff --cached --quiet || git commit -m "대시보드 자동 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin master
          git push


      - name: 연구 기록 실패 표시
        if: steps.research.outcome == 'failure'
        run: exit 1

      - name: 차트 갱신 실패 표시
        if: steps.charts.outcome == 'failure'
        run: exit 1

      - name: 페르소나 수집 실패 표시
        if: steps.personas.outcome == 'failure'
        run: exit 1
