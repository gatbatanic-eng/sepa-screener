name: SEPA Trend Template Daily Screening

on:
  schedule:
    # 평일(월~금) 20:00 KST = UTC 11:00
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크리닝 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python screening.py

      - name: 결과 CSV 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sepa-screening-result-${{ github.run_id }}
          path: output/*.csv
          retention-days: 90
