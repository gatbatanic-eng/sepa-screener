name: Dual-track entry overlay tests
on:
  pull_request:
    paths: ["entry_opportunity.py", "tests/test_entry_opportunity.py", "generate_dashboard.py", ".github/workflows/entry_overlay_ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python -m unittest tests.test_entry_opportunity -v
      - run: python -m py_compile entry_opportunity.py generate_dashboard.py
