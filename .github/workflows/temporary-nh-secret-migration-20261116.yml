name: Temporary NH secret migration 20261116
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: temporary-nh-secret-migration-20261116
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'gatbatanic-eng/sepa-screener' && github.ref == 'refs/heads/master' && github.actor == 'gatbatanic-eng'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Copy two secrets directly to the approved private repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TEMP_NH_MIGRATION_TOKEN_20261116 }}
          NHPLUG_APPKEY: ${{ secrets.NHPLUG_APPKEY }}
          NHPLUG_APPSECRET: ${{ secrets.NHPLUG_APPSECRET }}
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
        run: |
          python3 - <<'PY'
          """One-time GitHub-to-GitHub secret copy. No NH API or price requests."""
          import datetime as dt
          import json
          import os
          import subprocess

          SOURCE = 'gatbatanic-eng/sepa-screener'
          TARGET = 'gatbatanic-eng/golden-entry-research'
          TARGET_ID = 1441786051
          KEYS = ('NHPLUG_APPKEY', 'NHPLUG_APPSECRET')
          DEADLINE = dt.datetime(2026, 11, 17, 0, 0, tzinfo=dt.timezone.utc)


          class MigrationError(Exception):
              pass


          def migrate(env, run=subprocess.run, now=None):
              now = now or dt.datetime.now(dt.timezone.utc)
              if now >= DEADLINE:
                  raise MigrationError('Migration window expired')
              expected = {'GITHUB_REPOSITORY': SOURCE, 'GITHUB_REF': 'refs/heads/master',
                          'GITHUB_EVENT_NAME': 'workflow_dispatch', 'GITHUB_ACTOR': 'gatbatanic-eng',
                          'GITHUB_TRIGGERING_ACTOR': 'gatbatanic-eng'}
              if any(env.get(k) != v for k, v in expected.items()):
                  raise MigrationError('Source, branch, event or actor mismatch')
              if any(env.get(k, '').lower() in ('true', '1') for k in ('ACTIONS_STEP_DEBUG', 'ACTIONS_RUNNER_DEBUG', 'RUNNER_DEBUG')):
                  raise MigrationError('Debug logging must be disabled')
              if not all(env.get(k) for k in (*KEYS, 'GH_TOKEN')):
                  raise MigrationError('Required repository secret missing')
              # Children receive only the destination credential, not the NH key pair.
              child_env = {k: env[k] for k in ('PATH', 'HOME', 'SYSTEMROOT') if k in env}
              child_env.update(GH_TOKEN=env['GH_TOKEN'], GH_HOST='github.com',
                               GH_PROMPT_DISABLED='1', GH_NO_UPDATE_NOTIFIER='1')

              def command(args, value=None):
                  try:
                      result = run(['gh', *args], input=value, text=True, capture_output=True,
                                   timeout=45, env=child_env, check=False)
                  except Exception:
                      raise MigrationError('GitHub command could not complete') from None
                  if result.returncode:
                      raise MigrationError('GitHub command failed; response suppressed')
                  return result.stdout

              try:
                  repo = json.loads(command(['api', 'repos/' + TARGET]))
              except MigrationError:
                  raise
              except Exception:
                  raise MigrationError('Invalid destination metadata') from None
              if repo.get('id') != TARGET_ID or repo.get('full_name') != TARGET or repo.get('private') is not True:
                  raise MigrationError('Destination is not the approved private repository')
              for name in KEYS:
                  # gh seals the stdin value using the destination public key before upload.
                  command(['secret', 'set', name, '--repo', TARGET, '--app', 'actions'], env[name])
                  print('Stored ' + name + ' in approved private repository')
              names = json.loads(command(['secret', 'list', '--repo', TARGET, '--app', 'actions', '--json', 'name']))
              if not set(KEYS).issubset({item['name'] for item in names}):
                  raise MigrationError('Destination secret metadata verification failed')
              print('MIGRATION_COMPLETE; NOT_APPROVED; source credentials unchanged')


          if __name__ == '__main__':
              try:
                  migrate(dict(os.environ))
              except MigrationError as exc:
                  print('MIGRATION_STOPPED: ' + str(exc))
                  raise SystemExit(1)
              except Exception:
                  print('MIGRATION_STOPPED: unexpected error; details suppressed')
                  raise SystemExit(1)
          PY

