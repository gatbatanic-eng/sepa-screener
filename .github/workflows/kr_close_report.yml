name: KR Market Close Report

# 평일 16:10 KST(07:10 UTC) 한국 장 마감 정리. NHPLUG 조회 전용. 휴장일은 보고서를 쓰지 않는다.
# 새 보고서는 이슈 '한국 장 마감 정리'에 댓글로 올라온다(없으면 만든다). GitHub 예약은 지연될 수 있다.
on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: kr-close-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest tests.test_close_report -v
      - name: Build close report (query-only)
        env:
          NHPLUG_APPKEY: ${{ secrets.NHPLUG_APPKEY }}
          NHPLUG_APPSECRET: ${{ secrets.NHPLUG_APPSECRET }}
        run: python -m nhplug.close_report
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/market/kr_close 2>/dev/null || true
          git diff --cached --name-only --diff-filter=A | grep '\.md$' > "$RUNNER_TEMP/new_close.txt" || true
          git diff --cached --quiet && exit 0
          git commit -m "한국 장 마감 정리 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
      - name: Post to issue (push notification)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/new_close.txt" ] || exit 0
          title="한국 장 마감 정리 (평일 16:10 KST)"
          n=$(gh issue list --state open --search "\"한국 장 마감 정리\" in:title" --json number,title --jq '[.[] | select(.title | startswith("한국 장 마감 정리"))][0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create --title "$title" --body "평일 장 마감 후 자동으로 정리한 한국 시장 보고서가 댓글로 올라옵니다(규칙 기반, 투자 권유 아님). 이 이슈를 구독하면 모바일 알림을 받습니다." | grep -o '[0-9]*$')
          fi
          while read -r f; do
            { cat "$f"; echo; echo "[전체 보기](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${f})"; } > "$RUNNER_TEMP/body.md"
            gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
          done < "$RUNNER_TEMP/new_close.txt"
