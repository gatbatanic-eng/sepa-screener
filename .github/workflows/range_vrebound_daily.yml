name: RANGE-MR / V-REBOUND Daily Screening

on:
  schedule:
    # 평일(월~금) 20:30 KST = UTC 11:30 — SEPA 스크리너(20:00 KST)와 겹치지 않게 30분 뒤로 뺐다.
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "개발/테스트용: 유니버스 앞에서 N종목만 (비우면 전체)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: range-vrebound-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: range_vrebound
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크리닝 실행
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python run_daily_screen.py --limit "${{ github.event.inputs.limit }}"
          else
            python run_daily_screen.py
          fi

      - name: 대시보드(../docs/range_vrebound/index.html) 생성
        run: python generate_dashboard.py

      - name: 결과 DB + 대시보드 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.db ../docs/range_vrebound/
          git diff --cached --quiet || git commit -m "range_vrebound 일일 스크리닝 결과 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin master
          git push
