name: macro-daily

on:
  schedule:
    # 한국 평일 06:30 KST (= 전일 21:30 UTC) — 미국장 마감 + FRED 갱신 이후, 한국장 개장 전.
    # 기존 워크플로(daily_screen 11:00/22:00, screener_daily 12:00/22:30, range_vrebound 11:30)와
    # concurrency 그룹이 다르고(group: macro-daily) 커밋 전 rebase 하므로 충돌하지 않는다.
    - cron: "30 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        # 매크로 의존성은 레포 루트 requirements.txt 에 병합돼 있다 (pyyaml, anthropic, pykrx 등).
        run: pip install -r requirements.txt

      - name: Run macro pipeline
        working-directory: macro
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}                              # 비워두면 interpret.py 기본값(claude-sonnet-4-5)
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}                          # 없으면 KR3Y 지표만 생략
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}                    # 기존 SEPA 스크리너와 동일한 시크릿. 없으면 시트 저장 생략
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MACRO_JSON_PATH: ${{ github.workspace }}/docs/macro.json           # GitHub Pages 가 배포하는 폴더(docs/)로 바로 출력
        run: python run_macro.py

      - name: Sync dashboard assets into docs/
        run: |
          cp macro/docs/macro-card.js docs/macro-card.js
          cp "${{ github.workspace }}/docs/macro.json" macro/docs/macro.json   # 단독 미리보기 페이지(macro/docs/macro.html)도 최신 유지

      - name: Commit results
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add docs/macro.json docs/macro-card.js macro/docs/macro.json macro/docs/macro-card.js
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "macro: $(date -u +'%Y-%m-%d') 매크로 브리핑 갱신"
            git pull --rebase origin master
            git push
          fi
