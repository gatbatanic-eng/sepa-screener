name: Trend Fundamentals DART and SEC
on:
  workflow_dispatch:
  workflow_run:
    workflows: [SEPA Trend Template Daily Screening]
    types: [completed]
  push:
    branches: [master]
    paths: [publish_fundamentals.py, publish_us_fundamentals.py, tests/test_us_fundamentals.py, .github/workflows/fundamentals.yml]
permissions:
  contents: write
concurrency:
  group: sepa-screening
  cancel-in-progress: false
jobs:
  fundamentals:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify US fiscal period calculations
        run: python -m unittest discover -s tests -p test_us_fundamentals.py
      - name: Collect trend fundamentals
        id: collect
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python publish_fundamentals.py
      - name: Collect SEC trend fundamentals
        id: sec
        continue-on-error: true
        env:
          SEC_USER_AGENT: 'GoldenCodeResearch gatbatanic@gmail.com'
        run: python publish_us_fundamentals.py
      - name: Save public financial data and observation history
        run: |
          mkdir -p docs/data/fundamentals research/fundamentals
          git add -f docs/data/fundamentals/ research/fundamentals/
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Refresh trend fundamentals from DART and SEC'
          git pull --rebase origin master
          git push
      - name: Report collection failure
        if: steps.collect.outcome == 'failure' || steps.sec.outcome == 'failure'
        run: exit 1
