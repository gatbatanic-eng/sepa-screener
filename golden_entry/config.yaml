# 2026-10-31 사용자 지시로 10년 -> 5년으로 축소. 수집은 워밍업 포함 2020-01-01~, 분석은 2021-01-01~. 개발/홀드아웃 분할은 Phase 2 전에 사용자와 재확정 필요.
period: {fetch_start: "2020-01-01", analysis_start: "2021-01-01", dev_end: null, holdout_start: null}
collect:
  sleep_sec: 0.3
  cache_dir: data/cache
  markets: [KOSPI, KOSDAQ]
  universe_sample_freq: "YE"   # 연말 + 최신일 기준 종목 목록 스냅샷
universe: {min_listing_days: 250, min_avg_value_krw: 1.0e9, min_price: 1000}
costs: {commission_oneway: 0.00015, sell_tax: null, slippage: 0.002, slippage_illiquid: 0.004}
