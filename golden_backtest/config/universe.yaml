# 유니버스·수집 설정 (규격 v1.2). 성과를 보고 바꾸지 않는다.
universe:
  name: sp500_current          # S&P500 현재 구성종목 전체 (생존편향 있음 — 보고서에 명시)
  source: FinanceDataReader    # StockListing("S&P500")
  dual_class_retry: true       # 실패한 티커는 BRKB -> BRK-B 형식으로 재시도
fetch:
  start: "1970-01-05"          # FDR이 Windows에서 1970년 이전 날짜를 못 받는다. 이 이전 이력은 풀지 않는다
  benchmarks:
    sp500: US500
    vix: VIX
quality:
  anomaly_since: "2014-01-01"  # 이상치 집계 대상 구간
  big_move_pct: 0.40           # 일간 등락 절대값 기준
a1_history_check:
  asof: "2014-12-31"           # 이 날짜까지의 데이터에서 최고가를 찾는다
  first_bars: 252              # 첫 봉이 수집 하한(fetch.start)이고 최고가가 첫 252봉 안이면 A1 판정 불가
placeholder_strip:
  min_run: 5                   # 종목 시작 구간에서 O=H=L=C·거래량 0인 봉이 5개 이상 연속이면 그 구간 끝까지 자른다
adjustment_artifact:
  threshold: 0.10              # |수정 종가 수익률 - 공급자 Close 수익률| > 10%p 인 봉을 목록화
  split_match_days: 3          # 분할 이벤트 ex-date가 ±3 달력일 안이면 "분할 이벤트 있음"
price_filter:
  min_raw_close: 10.0          # [원전] 비수정(분할 전 실제) 종가 > 10달러, 이 값에만 적용

# P1 유니버스 제외 규칙. 데이터는 수집·보관하되 백테스트 유니버스(manifest/universe_p1.json)에서만 뺀다.
exclude:
  static:                      # 키는 저장명(BRK-B 형식)
    DHR: "분리상장(Fortive) 보정 오류: 2016-07-05 수정 종가 +61%인데 공급자 Close는 +3.6%. 가짜 신고가 봉을 만든다"
    CTVA: "분리상장 미보정: 2026-10-01 -84%가 수정 종가에 그대로 남아 있다. 공급자가 소급 보정하면 과거 값이 바뀔 수 있다"
  rules:
    adjustment_artifact_unexplained_by_split:
      since: "2014-01-01"      # 이 날짜 이후 봉만 본다(백테스트 구간 + 워밍업). 전 구간으로 넓히면 제외 종목이 크게 늘어난다
      reason: "수정/공급자 종가 수익률이 10%p 넘게 어긋나는 봉이 있는데 분할 이벤트로 설명되지 않는다"
    consecutive_missing:
      since: "2015-01-01"      # 연속 결측 구간의 시작일이 이 날짜 이후
      max_run: 5               # 이 값을 넘는(6봉 이상) 연속 결측(가격 NaN·0 이하) 행
      reason: "2015년 이후 구간에 5봉 넘는 연속 결측이 있다"
