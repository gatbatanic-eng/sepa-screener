# B1 터틀 System 2 (규격 v1.5). 값은 규격 그대로 고정한다 — 성과를 보고 바꾸지 않는다. 민감도(±20%)는 evaluation/sensitivity.py에서만 본다.
code: B1
version: "1.0"            # 전략 구현 버전
entry_model: M2           # 스탑주문형: 신호 다음 봉에 돌파가 매수 스탑
entry_n: 55               # [원전] 직전 55일 최고가 돌파 (System 2)
exit_n: 20                # [원전] 직전 20일 최저가 이탈 청산 (장중 스탑)
atr_n: 20                 # [원전] N = 20일 ATR (Wilder 평활. 원전 N = (19×전일 N + TR)/20 과 같은 식)
stop_mult: 2.0            # [원전] 초기 손절 = 진입가 − 2N (장중 스탑)
trade_start: "2015-01-01" # [규격 기간] 이 날짜 이후 신호만. 워밍업용 이전 데이터는 지표 계산에만 쓴다
# [단순화] 제외: ½N마다 최대 4유닛 피라미딩, 숏. 10달러·거래대금 필터는 규격에 없어 적용하지 않는다(결과 보고에 비수정 10달러 미만 진입 수를 따로 표시)
